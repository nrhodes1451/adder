# Cross-origin isolation enables SharedArrayBuffer, which the Python worker
# uses for synchronous range reads. add_header in a location replaces the
# server-level ones, so every location repeats these two.
map $host $canonical_host {
  ~^www\.(?<apex>.+)$ $apex;
  default "";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # IndexedDB is per origin: keep everyone on the apex so workbooks stay in one place.
  if ($canonical_host) {
    return 301 https://$canonical_host$request_uri;
  }

  location /assets/ {
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
